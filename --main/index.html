<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>מיסטיקה רוחנית · קריאה בקלפי טארוט</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@300;400;500;700;900&family=Heebo:wght@200;300;400;500;700&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Assistant:wght@200;300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="site.css" />

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      font-family: 'Heebo', 'Assistant', system-ui, sans-serif;
      background: var(--bg);
      color: var(--ink);
      min-height: 100vh;
      overflow-x: hidden;
      transition: background 0.6s ease, color 0.6s ease;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
    :root {
      --bg: #0d0a1a;
      --bg-2: #15102b;
      --ink: #f0e6d2;
      --ink-soft: rgba(240, 230, 210, 0.72);
      --ink-faint: rgba(240, 230, 210, 0.45);
      --gold: #d4af6f;
      --gold-soft: rgba(212, 175, 111, 0.4);
      --gold-faint: rgba(212, 175, 111, 0.15);
      --rose: #c89aa8;
      --line: rgba(212, 175, 111, 0.22);
    }
    .display { font-family: 'Frank Ruhl Libre', 'Cormorant Garamond', serif; }
    .body-font { font-family: 'Heebo', 'Assistant', sans-serif; }
    .latin { font-family: 'Cormorant Garamond', 'Frank Ruhl Libre', serif; font-style: italic; }

    /* Selection */
    ::selection { background: var(--gold-soft); color: var(--bg); }

    /* Scroll smoothing */
    html { scroll-behavior: smooth; }

    /* Subtle fade-in on load */
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(14px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .reveal { animation: fadeUp 1s cubic-bezier(.2,.7,.2,1) both; }
    .reveal-delay-1 { animation-delay: .15s; }
    .reveal-delay-2 { animation-delay: .3s; }
    .reveal-delay-3 { animation-delay: .45s; }
    .reveal-delay-4 { animation-delay: .6s; }

    /* Slow twinkle */
    @keyframes twinkle {
      0%, 100% { opacity: 0.3; }
      50%      { opacity: 1; }
    }
    /* Gentle float */
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50%      { transform: translateY(-6px); }
    }
    /* Slow rotate for cosmic rings */
    @keyframes spinSlow {
      from { transform: rotate(0deg); }
      to   { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel" src="tweaks-panel.jsx"></script>
  <script type="text/babel" src="card-deck.jsx"></script>
  <script type="text/babel" src="app.jsx"></script>
</body>
</html>
